# pod-template.yaml

apiVersion: v1
kind: Pod
metadata:
  namespace: jenkins
spec:
  # Pod를 'core-on' 노드 그룹에만 할당
  nodeSelector:
    node-role: core
  
  # ECR 접근 권한이 있는 서비스 계정 지정
  serviceAccountName: jenkins-agent
  
  containers:
  - name: node
    image: node:18-slim
    command: ["sleep"]
    args: ["infinity"]
  - name: podman
    image: quay.io/podman/stable
    command: ["sleep"]
    args: ["infinity"]
    securityContext:
      privileged: true
  - name: aws-cli
    image: amazon/aws-cli:latest
    command: ["sleep"]
    args: ["infinity"]
