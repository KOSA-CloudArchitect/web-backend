# pod-template.yaml

apiVersion: v1
kind: Pod
spec:
  # 이 Pod를 'core-on' 노드 그룹에만 할당하도록 지정
  nodeSelector:
    node-role: core

  # =======================================================================
  # ECR 접근 권한을 부여하기 위해 이 라인을 추가합니다.
  serviceAccountName: jenkins-agent
  # =======================================================================

  containers:
  - name: node
    image: node:18-slim
    command: ["sleep"]
    args: ["infinity"]
  - name: podman
    image: quay.io/podman/stable
    command: ["sleep"]
    args: ["infinity"]
    securityContext:
      privileged: true
  - name: aws-cli
    image: amazon/aws-cli:latest
    command: ["sleep"]
    args: ["infinity"]
